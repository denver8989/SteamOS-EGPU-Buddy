# NV-EGPU-Buddy: a Plasma session earlier in the same boot leaves WAYLAND_DISPLAY=wayland-0
# in the systemd user environment. Steam (and every game) inherits it, and the gamescope WSI
# layer then refuses to attach ("not running under gamescope") -> games present through
# Xwayland: black/frozen loading screens, no perf overlay. Stock Game Mode never has it set.
[Service]
UnsetEnvironment=WAYLAND_DISPLAY WAYLAND_SOCKET
