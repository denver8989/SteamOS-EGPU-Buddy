[Service]
TimeoutStartSec=45
ExecStart=
ExecStart=/home/deck/.local/bin/nv-egpu-gamescope-session
# Exact 2026-06-12 02:34 working config (clean, slightly laggy): native 5120x1440
# Steam canvas (NOT the 3840x1080 nested downscale), gold filter + DRM_SYNC_GUARDS
# (the sync guards = clean-but-laggy tradeoff), @60. eGPU-branch-scoped -> iGPU untouched.
Environment=NV_EGPU_GAMESCOPE_NATIVE_STEAM_CANVAS=1
UnsetEnvironment=DISPLAY WAYLAND_DISPLAY WAYLAND_SOCKET XAUTHORITY STEAM_GAMESCOPE_FORCE_HDR_DEFAULT STEAM_GAMESCOPE_FORCE_OUTPUT_TO_HDR10PQ_DEFAULT
# 2026-09-11: NVIDIA scanout corruption root cause = scattered vidmem behind Vulkan-allocated scanout
# dmabufs (NVIDIA bug 5240452, forum 295314 #27). Fix = gamescope built from NightHammer1000/gamescope
# poc/gamescope-gbm-route (3.16.25-8-g2bfc18c) allocating scanout via GBM; built by
# packaging/gamescope-gbm/build.sh into ~/.local/gamescope-gbm. The shim falls back to /usr/bin/gamescope
# if that binary cannot run. Confirmed clean by user on RTX 5060 Ti / 610.57.04 / 5120x1440.
Environment=NV_EGPU_BUDDY_GAMESCOPE_BIN=/home/deck/.local/gamescope-gbm/usr/bin/gamescope
Environment=gamescope_drm_gbm_scanout=1
Environment=NV_EGPU_GAMESCOPE_FORMAT_FILTER_ENABLE=0
# HDR exposure opt-in (Steam's per-display HDR toggle decides at runtime)
Environment=NV_EGPU_GAMESCOPE_HDR=1
Environment=STOCK_GAMESCOPE_SESSION=/usr/lib/steamos/gamescope-session
