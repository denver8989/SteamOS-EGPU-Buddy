# eGPU: block udev/alias autoload of nvidia so egpu-hotplug-mount.sh can FLR +
# resize BAR1 to 16GB BEFORE the driver binds (resize needs an unbound GPU).
# Without this the loader races the resize and BAR1 stays at 256MiB.
# nv-egpu-buddy-privileged loads it explicitly with `modprobe --ignore-install nvidia`,
# which bypasses these lines by design.
install nvidia /bin/false
install nvidia_drm /bin/false
install nvidia_modeset /bin/false
