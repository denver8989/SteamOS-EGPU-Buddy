# eGPU NVIDIA tuning — RTX 3080 over USB4 (Aoostar AG03) — added 2026-06-04
#  -> disable GSP-RM. The GSP firmware-upload burst at
#   driver init is the heavy config/BAR traffic that floods the marginal USB4 PCIe
#   tunnel (data-fabric sync flood -> hard reset). The open 610 driver CANNOT
#   disable GSP; this is the entire reason we swapped to proprietary 580.
# NVreg_EnableResizableBar=1 -> ENABLE ReBAR (expose full VRAM via large BAR1) for eGPU perf.
# NVreg_DynamicPowerManagement=0x00 -> no runtime D3; keep the card fully powered.
options nvidia NVreg_EnableResizableBar=1 NVreg_DynamicPowerManagement=0x00
